<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Main Menu</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 120px;   /* wide spacing */
    background: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
  }

  .btn {
    width: 180px;
    height: 30px;
    background: #1a45ff;
    color: #fff;

    border: none;
    cursor: pointer;

    font-size: 16px;
    letter-spacing: -0.2px;

    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    transition: box-shadow 0.2s ease, transform 0.2s ease;
  }

  .btn:hover {
    box-shadow: 0 6px 14px rgba(0,0,0,0.22);
  }

  .btn:active {
    transform: translateY(2px);
    box-shadow: 0 3px 6px rgba(0,0,0,0.12);
  }
</style>
</head>

<body>

<button class="btn" onclick="window.location.href='sketch1.html'">monogram</button>
<button class="btn" onclick="window.location.href='sketch2.html'">self-portrait</button>

</body>
</html>
